<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>パズル全部集合</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header"><a href="#" class="logo">🧩 パズル全部集合</a><button id="mute" class="icon-btn" type="button" aria-label="音の切り替え">🔊</button></header>
<main>
  <section id="menu">
    <div id="filters" class="filters"></div>
    <div id="cards" class="cards"></div>
  </section>
  <section id="view" hidden>
    <div class="view-head">
      <a href="#" class="btn">← 一覧</a>
      <h1 id="game-title"></h1>
      <button id="tut-btn" class="btn tut-btn" type="button">📖 遊び方</button>
    </div>
    <div id="toolbar" class="toolbar"></div>
    <div id="status" class="status"></div>
    <div id="stage" class="stage"></div>
  </section>
</main>
<div id="tut" class="overlay tut" hidden>
  <div class="modal tut-box">
    <button id="tut-close" class="tut-x" type="button" aria-label="閉じる">×</button>
    <div id="tut-step" class="tut-step"></div>
    <h2 id="tut-title"></h2>
    <div id="tut-figs" class="tut-figs"></div>
    <p id="tut-text" class="tut-text"></p>
    <div class="tut-nav">
      <button id="tut-prev" class="btn" type="button">◀ 前へ</button>
      <div id="tut-dots" class="tut-dots"></div>
      <button id="tut-next" class="btn primary" type="button">次へ ▶</button>
    </div>
  </div>
</div>
<div id="overlay" class="overlay" hidden>
  <div class="modal"><h2 id="ov-title"></h2><p id="ov-text"></p><div id="ov-actions" class="actions"></div></div>
</div>

<script src="js/core.js"></script>
